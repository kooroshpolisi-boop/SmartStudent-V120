name: Build Planner Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "SmartStudent_V120_GitHub_Upload.zip"
      - ".github/workflows/build-planner-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project package
        run: |
          test -f SmartStudent_V120_GitHub_Upload.zip
          unzip -o SmartStudent_V120_GitHub_Upload.zip -d .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      - name: Prepare web app
        run: npm run prepare:web

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply localized app names
        run: bash scripts/set-android-labels.sh

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Planner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
